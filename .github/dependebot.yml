version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
        interval: "weekly"
```[cite: 12]

6. Guarda los cambios y cierra el archivo.

*Verification:* Si abres GitHub Desktop, verás que ha detectado un archivo nuevo en la ruta `.github/dependabot.yml`.

---

### Paso 2: Añadir las dependencias de la aplicación (Opcional / Recomendado)

El enunciado indica que, además de las acciones de GitHub, si tu proyecto utiliza dependencias de algún lenguaje (como Node.js con `package.json`, Python, etc.), es recomendable añadir otro bloque en el mismo archivo para que Dependabot también las vigile[cite: 13]. 

* ¿Tu proyecto tiene algún archivo como `package.json` o similar en la raíz? 
  * **Si lo tiene:** Añadiríamos otro bloque en el archivo `dependabot.yml` especificando el gestor (por ejemplo, `"npm"`)[cite: 13].
  * **Si es un proyecto estático o no tiene gestor de paquetes:** En tu documento de entrega simplemente indicarás que el proyecto no cuenta con un ecosistema de dependencias adicional o que se centra únicamente en la automatización de GitHub Actions[cite: 13].

---

### Paso 3: Subir los cambios a GitHub (*Commit* y *Push*)

Ahora vamos a enviar la configuración a tu repositorio remoto en GitHub:

1. Vuelve a **GitHub Desktop**.
2. Abajo a la izquierda, en el cuadro de resumen, escribe un mensaje de *commit* (por ejemplo: `Añade configuracion de Dependabot`)[cite: 1].
3. Haz clic en el botón azul **Commit to main**.
4. Arriba a la derecha, haz clic en el botón azul **Push origin** para subirlo a tu cuenta de GitHub.

*Verification:* Entra en tu repositorio en la web de GitHub y comprueba que la carpeta `.github` con el archivo `dependabot.yml` aparece correctamente en la rama principal (`main`)[cite: 13].

---

### Paso 4: Preparar la evidencia para la entrega

Tal como pide el apartado de **Evidencia que debes entregar** en el PDF, tu documento final (puedes estructurarlo igual que el de la práctica anterior en PDF) debe contener[cite: 13]:

1. **Enlace o captura del repositorio y del archivo:** Una captura de pantalla donde se vea en GitHub la ruta `.github/dependabot.yml` dentro de tu repositorio o el enlace directo al archivo[cite: 13].
2. **El contenido de la configuración:** Mostrar el código YAML que has incluido para `github-actions`[cite: 13].
3. **Explicación del ecosistema:** Una breve frase aclarando que has configurado el ecosistema de GitHub Actions para revisar las actualizaciones de manera semanal (`weekly`) y, en caso de tener o no dependencias de aplicación, mencionarlo brevemente[cite: 12, 13].